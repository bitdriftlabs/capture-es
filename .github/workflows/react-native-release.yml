name: React Native Release

permissions:
  contents: write
  id-token: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The package version to use e.g. 1.80.0'
        required: true
        type: string

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Javascript
        uses: ./.github/actions/javascript-setup
      - name: Get Capture SDK version
        id: capture-sdk
        run: |
          CAPTURE_SDK_VERSION=$(node -p "require('./packages/react-native/package.json').captureSdkVersion")
          echo "version=$CAPTURE_SDK_VERSION" >> $GITHUB_OUTPUT
      - name: Validate React Native version against Capture SDK, repository and npm
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { version: currentVersion, captureSdkVersion: sdkVersion } = require('./packages/react-native/package.json');
          const version = process.env.VERSION;
          if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
            throw new Error(`Expected a stable major.minor.patch version: ${version}`);
          }
          const [major, minor, patch] = version.split('.').map(Number);
          const [sdkMajor, sdkMinor, sdkPatch] = sdkVersion.split('.').map(Number);
          if (major !== sdkMajor || minor !== sdkMinor || patch < sdkPatch) {
            throw new Error(`React Native ${version} must use Capture SDK ${sdkVersion}'s major/minor. Only the patch may increase.`);
          }
          const published = JSON.parse(execFileSync('npm', [
            'view', '@bitdrift/react-native', 'versions', '--json', '--prefer-online'
          ], { encoding: 'utf8' }));
          for (const existing of [currentVersion, ...published.filter(v => !v.includes('-') && !v.includes('+'))]) {
            const [existingMajor, existingMinor, existingPatch] = existing.split('.').map(Number);
            const newer = major > existingMajor ||
              (major === existingMajor && minor > existingMinor) ||
              (major === existingMajor && minor === existingMinor && patch > existingPatch);
            if (!newer) {
              throw new Error(`React Native ${version} must be newer than ${existing}, already recorded in the repository or published to npm. Choose a higher patch.`);
            }
          }
          NODE
      - name: Prepare release
        run: |
          npm version --workspace @bitdrift/react-native $VERSION
          npx nx prepare-release @bitdrift/react-native
      - name: Publish release
        run: npm publish ./dist/react-native --provenance
      - name: Create a PR with the updated version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTURE_SDK_VERSION: ${{ steps.capture-sdk.outputs.version }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git checkout -b release-rn-$VERSION
          git add packages/react-native/package.json package-lock.json
          git commit -m "chore: release react-native $VERSION (capture-sdk $CAPTURE_SDK_VERSION)"
          git push --set-upstream origin release-rn-$VERSION

          gh pr create --title "chore: release react-native $VERSION" --body "v$VERSION (capture-sdk v$CAPTURE_SDK_VERSION)" --base main --head release-rn-$VERSION
          gh pr merge --auto -r
