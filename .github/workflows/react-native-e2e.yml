name: React Native E2E
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-ios:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - new_arch: true
          - new_arch: false

    name: ios [new_arch = ${{ matrix.settings.new_arch }}]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Setup Javascript
        uses: ./.github/actions/javascript-setup

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            examples/expo/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ matrix.settings.new_arch }}-${{ hashFiles('packages/react-native/BdReactNative.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-${{ matrix.settings.new_arch }}-

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
        env:
          MAESTRO_VERSION: 2.11.0

      - name: Create .env file
        run: |
          cd examples/expo
          echo "EXPO_PUBLIC_BITDRIFT_API_KEY=fake_key" >> .env

      - name: Prebuild
        run: npm exec nx prebuild expo-example -- --platform ios
        env:
          NEW_ARCH: ${{ matrix.settings.new_arch }}

      - name: Install CocoaPods
        run: |
          cd examples/expo/ios
          pod install

      - name: Build iOS app
        run: |
          cd examples/expo/ios
          xcodebuild \
            -workspace ExpoExample.xcworkspace \
            -scheme ExpoExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(python - <<'PY'
          import json
          import subprocess
          data = subprocess.check_output([
              "xcrun",
              "simctl",
              "list",
              "devices",
              "available",
              "-j",
          ])
          devices = json.loads(data)["devices"]
          for runtime, entries in devices.items():
              for device in entries:
                  if device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulators found")
          PY
          )
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Install app on simulator
        run: |
          xcrun simctl install "$DEVICE_ID" examples/expo/ios/build/Build/Products/Debug-iphonesimulator/ExpoExample.app

      - name: Resolve Metro cache directory
        id: metro-cache-dir
        run: echo "path=$(node -p "require('path').join(require('os').tmpdir(), 'metro-cache')")" >> $GITHUB_OUTPUT

      - name: Restore Metro cache
        id: metro-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.metro-cache-dir.outputs.path }}
          key: ${{ runner.os }}-metro-ios-${{ matrix.settings.new_arch }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-metro-ios-${{ matrix.settings.new_arch }}-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-metro-ios-${{ matrix.settings.new_arch }}-

      - name: Serve Expo
        run: npm exec nx start expo-example -- --port 8081 > /tmp/expo_logs &

      - name: Wait for Metro bundler
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/status | grep -q "packager-status:running" && exit 0
            sleep 2
          done
          echo "Metro bundler did not start"
          exit 1

      - name: Warm up Metro bundle
        run: |
          curl -sf -o /dev/null --max-time 900 \
            "http://localhost:8081/.expo/.virtual-metro-entry.bundle?platform=ios&dev=true&lazy=true&minify=false&inlineSourceMap=false&modulesOnly=false&runModule=true&excludeSource=true&sourcePaths=url-server&app=com.bitdrift.io.expoExample"

      - name: Save Metro cache
        if: steps.metro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.metro-cache-dir.outputs.path }}
          key: ${{ steps.metro-cache.outputs.cache-primary-key }}

      - name: Run Maestro tests
        timeout-minutes: 15
        run: |
          cd examples/expo
          maestro test maestro_flow.yaml
        env:
          MAESTRO_CLI_NO_ANALYTICS: true
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-ios-${{ matrix.settings.new_arch }}-test-results
          path: ~/.maestro/tests/*

      - name: Print Expo logs
        if: always()
        run: test -f /tmp/expo_logs && cat /tmp/expo_logs || true

  test-android:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            new_arch: true
          - host: ubuntu-latest
            new_arch: false

    name: android [new_arch = ${{ matrix.settings.new_arch }}]
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Javascript
        uses: ./.github/actions/javascript-setup

      - name: Setup linux dependencies
        run: sudo apt-get install -y lld

      - name: Setup rust/dependencies
        # // TODO we dont need all these
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo
      - name: Install Maestro
        run: |
          wget -q -O /tmp/${MAESTRO_VERSION} "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q /tmp/${MAESTRO_VERSION} -d /opt/ 
          rm /tmp/${MAESTRO_VERSION}
          echo "/opt/maestro/bin" >> $GITHUB_PATH
        env:
          MAESTRO_VERSION: 1.39.9
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create .env file
        run: |
          cd examples/expo
          echo "EXPO_PUBLIC_BITDRIFT_API_KEY=fake_key" >> .env
      - name: Prebuild
        run: npm exec nx prebuild expo-example
        env:
          NEW_ARCH: ${{ matrix.settings.new_arch }}
      - name: Serve Expo
        run: npm exec nx start expo-example > /tmp/expo_logs &
      - name: run tests
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # pin@v2.35.0
        with:
          api-level: 29
          script: cd examples/expo/android && ./gradlew installDebug --build-cache -PreactNativeDevServerPort=19000 -PreactNativeArchitectures=x86 && maestro test ../maestro_flow.yaml
        env:
          MAESTRO_CLI_NO_ANALYTICS: true
      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-android-${{ matrix.settings.new_arch }}-test-results
          path: /home/runner/.maestro/tests/*
      - name: Print Expo logs
        if: always()
        run: cat /tmp/expo_logs
